<style>
  :root{
    --pink:#fdc8c8;
    --rope:#35803d;
    --rope-deep:#245c2a;
  }

  *{box-sizing:border-box;}

  html,body{height:100%;}

  body{
    margin:0;
    background:var(--pink);
    color:var(--rope-deep);
    font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100svh;
    padding:clamp(16px,4vw,48px);
    padding-bottom:max(clamp(16px,4vw,48px),env(safe-area-inset-bottom));
    text-align:center;
  }

  main{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:640px;
    animation:rise 1s cubic-bezier(.22,.75,.3,1) both;
  }

  /* The artwork's own field is this exact pink, so it dissolves into the page —
     no card, no border, no shadow. The page IS the poster. */
  .art{
    display:block;
    width:100%;
    height:auto;
    max-height:86svh;
    object-fit:contain;
    margin:0;
  }

  /* Kept for screen readers and crawlers; nothing renders. */
  .sr-only{
    position:absolute;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  @keyframes rise{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:none;}
  }

  @media (prefers-reduced-motion:reduce){
    main{animation:none;}
  }

  @media (max-height:560px){
    .art{max-height:76svh;}
  }
</style>
</head>
<body>
  <main>
    <img
      class="art"
      src="https://raw.githubusercontent.com/stereoke/images/main/phyllis-ranch-san-miguel-california.jpg"
      width="1254"
      height="1254"
      fetchpriority="high"
      decoding="async"
      alt="Phyllis Ranch — the Mona Lisa wearing a white cowboy hat on a pink field, with the Phyllis Ranch name in green rope lettering.">
<h1 class="sr-only">Phyllis Ranch</h1>
  </main>
</body>
</html>
