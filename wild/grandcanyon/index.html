<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#fff}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .strip{list-style:none;margin:0;padding:0;display:flex;overflow-x:auto;overflow-y:hidden;background:#fff;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .strip:focus-visible{outline:2px solid #222;outline-offset:-2px}
  .slide{flex:0 0 auto;margin:0}
  .slide img{display:block;background:#f4f4f4}

  /* Mobile: one panel per screen, stepper above */
  @media (max-width:799.98px){
    body{display:flex;flex-direction:column;justify-content:center;min-height:100dvh}
    .strip{scroll-snap-type:x mandatory;scrollbar-width:none}
    .strip::-webkit-scrollbar{display:none}
    .slide{flex-basis:100%;scroll-snap-align:center;scroll-snap-stop:always}
    .slide img{width:100%;height:auto;max-height:calc(100dvh - 40px);object-fit:contain;background:#fff}
    .stepper{display:flex;justify-content:center;align-items:center;height:40px;padding:0 12px}
    .stepper button{appearance:none;border:0;background:none;padding:16px 2px;margin:0;cursor:pointer;flex:0 1 auto;min-width:0}
    .stepper button span{display:block;width:5px;height:5px;border-radius:5px;background:#8e8e8e;transition:width .25s ease,background-color .25s ease}
    .stepper button[aria-current="true"] span{width:22px;background:#222}
    .stepper button:focus-visible span{outline:2px solid #222;outline-offset:3px}
  }

  /* Desktop: continuous film strip */
  @media (min-width:800px){
    body{overflow:hidden}
    .strip{height:100dvh}
    .slide img{height:100dvh;width:auto}
    .stepper{display:none}
  }
  @media (prefers-reduced-motion:reduce){.stepper button span{transition:none}}

  /* Video hotspots + lightbox */
  .slide{position:relative}
  .play{position:absolute;top:0;bottom:0;border:0;padding:0;margin:0;background:none;cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
  .play:focus-visible{outline:3px solid #fff;outline-offset:-6px}
  .play span{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 14px rgba(0,0,0,.35);transition:opacity .2s ease,transform .2s ease}
  .play span::before{content:"";margin-left:4px;border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent #222}
  @media (min-width:800px){.play span{width:76px;height:76px}.play span::before{margin-left:6px;border-width:14px 0 14px 23px}}
  @media (min-width:800px) and (hover:hover){
    .play span{opacity:0;transform:scale(.85)}
    .play.main span{position:relative;left:var(--dx,0)}
    .play:not(.main) span{display:none}
    .play.on span,.play.main:focus-visible span{opacity:1;transform:none}
  }
  #lb{border:0;padding:0;background:none;max-width:none;max-height:none;overflow:visible}
  #lb::backdrop{background:rgba(0,0,0,.88)}
  #lb .frame{width:min(92vw,calc(80dvh*var(--r,1.7778)));aspect-ratio:var(--r,1.7778);background:#000}
  #lb iframe{display:block;width:100%;height:100%;border:0}
  #lb .x{position:absolute;top:-46px;right:-4px;width:44px;height:44px;border:0;background:none;color:#fff;font:300 34px/1 system-ui,sans-serif;cursor:pointer}
  #lb .x:focus-visible{outline:2px solid #fff}
  @media (prefers-reduced-motion:reduce){.play span{transition:none}}
</style>
</head>

<script>
(function(){
  var strip=document.getElementById('strip'),nav=document.querySelector('.stepper'),
      status=document.getElementById('status'),orig=[].slice.call(strip.children),n=orig.length,cur=-1,frac=0,timer,
      desktop=matchMedia('(min-width:800px)'),calm=matchMedia('(prefers-reduced-motion:reduce)'),btns=[];
  /* Endless loop: a hidden copy of the set on each side, and the scroll position
     is quietly shifted back into the middle set whenever it drifts out. */
  function copy(before){orig.forEach(function(li){
    var c=li.cloneNode(true),im=c.querySelector('img');
    c.removeAttribute('id');c.setAttribute('aria-hidden','true');
    im.alt='';im.loading='lazy';im.removeAttribute('fetchpriority');
    var pb=c.querySelector('.play');if(pb)pb.tabIndex=-1;
    before?strip.insertBefore(c,orig[0]):strip.appendChild(c);
  });}
  copy(true);copy(false);
  var all=strip.children;
  function left(k){return all[k].offsetLeft-all[0].offsetLeft;}
  function rebase(){var w=left(n),x=strip.scrollLeft;
    if(x<w-1)strip.scrollLeft=x+w;else if(x>=2*w-1)strip.scrollLeft=x-w;}
  function abs(){return Math.round(strip.scrollLeft/strip.clientWidth);}
  function go(k){strip.scrollTo({left:left(k),behavior:calm.matches?'auto':'smooth'});}
  for(var i=0;i<n;i++)(function(i){
    var b=document.createElement('button');b.type='button';
    b.setAttribute('aria-label','Slide '+(i+1)+' of '+n);
    b.appendChild(document.createElement('span'));
    b.addEventListener('click',function(){go(n+i);});
    nav.appendChild(b);btns.push(b);
  })(i);
  function update(){
    if(desktop.matches)return;
    var i=((abs()%n)+n)%n;
    if(i===cur)return;
    if(cur>=0)btns[cur].removeAttribute('aria-current');
    btns[i].setAttribute('aria-current','true');
    if(cur>=0)status.textContent='Slide '+(i+1)+' of '+n;
    cur=i;
  }
  strip.addEventListener('scroll',function(){
    if(desktop.matches)rebase();
    else{clearTimeout(timer);timer=setTimeout(rebase,140);}
    frac=strip.scrollLeft/strip.scrollWidth;
    requestAnimationFrame(update);
  },{passive:true});
  addEventListener('resize',function(){
    strip.scrollLeft=desktop.matches?frac*strip.scrollWidth:left(n+Math.max(cur,0));
    if(cur>=0)btns[cur].removeAttribute('aria-current');cur=-1;update();
  });
  strip.scrollLeft=left(n);frac=1/3;update();
  /* Desktop: a normal mouse wheel drives the strip sideways */
  strip.addEventListener('wheel',function(e){
    if(!desktop.matches||e.ctrlKey||Math.abs(e.deltaX)>=Math.abs(e.deltaY))return;
    e.preventDefault();
    strip.scrollLeft+=e.deltaY*(e.deltaMode===1?32:1);
  },{passive:false});
  /* Mobile: arrow keys step one slide */
  strip.addEventListener('keydown',function(e){
    if(desktop.matches)return;
    var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;
    if(d){e.preventDefault();go(abs()+d);}
  });
  /* Video lightbox */
  var lb=document.getElementById('lb'),frame=lb.querySelector('.frame');
  function group(b,on){[].forEach.call(strip.querySelectorAll('.play[data-video="'+b.dataset.video+'"]'),function(p){p.classList.toggle('on',on);});}
  strip.addEventListener('mouseover',function(e){var b=e.target.closest('.play');if(b)group(b,true);});
  strip.addEventListener('mouseout',function(e){var b=e.target.closest('.play');if(b)group(b,false);});
  strip.addEventListener('click',function(e){
    var b=e.target.closest('.play');if(!b||!lb.showModal)return;
    frame.style.setProperty('--r',b.dataset.ratio);
    frame.innerHTML='<iframe src="https://www.youtube.com/embed/'+b.dataset.video+'?autoplay=1&rel=0&playsinline=1" title="'+b.getAttribute('aria-label').replace('Play video: ','')+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
    lb.showModal();
  });
  lb.addEventListener('click',function(e){if(e.target===lb||e.target.closest('.x'))lb.close();});
  lb.addEventListener('close',function(){frame.innerHTML='';});
})();
</script>
